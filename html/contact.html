<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contact — Atlas</title>
        <meta name="description" content="Get in touch with ATLAS — the student-run engineering organisation at SDU Sønderborg.">
        <link rel="icon" href="../db/assets/atlas-seal-100px.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400&display=swap">
        <link rel="stylesheet" href="../style/header.css">
        <link rel="stylesheet" href="../style/contact.css">
        <link rel="stylesheet" href="../style/footer.css">
    </head>
    <body>

        <div id="header_div"></div>

        <section class="contact_body">
            <div class="Contact_div">
                <p class="eyebrow">Get in touch</p>
                <h1 class="contact_header">Contact <span class="contact-outline">us</span></h1>
                <p class="contact_lede">Got a question about ATLAS, our projects, or joining the team? Reach out, we usually reply within a couple of days.</p>
                <div class="contact-info">
                    <a class="contact-info-item" href="https://mail.google.com/mail/?view=cm&fs=1&to=atlasadvanced@org.sdu.dk" target="_blank" rel="noopener noreferrer">
                        <span class="contact-info-label">Email</span>
                        <span class="contact-info-value">atlasadvanced@org.sdu.dk</span>
                    </a>
                    <div class="contact-info-item">
                        <span class="contact-info-label">Location</span>
                        <span class="contact-info-value">Alsion, Sønderborg, Denmark</span>
                    </div>
                    <a class="contact-info-item" href="https://www.instagram.com/sduatlas/?hl=sk" target="_blank" rel="noopener noreferrer">
                        <span class="contact-info-label">Instagram</span>
                        <span class="contact-info-value">@sduatlas</span>
                    </a>
                    <a class="contact-info-item" href="https://www.facebook.com/profile.php?id=61594311675031" target="_blank" rel="noopener noreferrer">
                        <span class="contact-info-label">Facebook</span>
                        <span class="contact-info-value">ATLAS Advanced Engineering</span>
                    </a>
                </div>
            </div>
            <div class="contact-map">
                <iframe
                    src="https://www.google.com/maps?q=Alsion,+S%C3%B8nderborg,+Denmark&output=embed"
                    title="Map of Alsion, Sønderborg"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                <div class="find-us">
                    <p class="find-us-title">Where to find us</p>
                </div>
            </div>
        </section>

        <div id="footer_div"></div>
        <script src="../js/main.js"></script>
    </body>
</html>
