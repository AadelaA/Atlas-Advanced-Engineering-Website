<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Atlas</title>
        <meta name="description" content="ATLAS is a student-run engineering organisation at SDU Sønderborg">
        <link rel="icon" href="../db/assets/atlas-seal-100px.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400&display=swap">
        <link rel="stylesheet" href="../style/header.css">
        <link rel="stylesheet" href="../style/home.css">
        <link rel="stylesheet" href="../style/footer.css">
    </head>
    <body>

        <div id="header_div"></div>
        <section class="hero">
            <canvas id="globe" aria-hidden="true"></canvas>
            <div class="hero-content">
                <div class="hero-title">
                    <p class="hero-eyebrow">Atlas Advanced Engineering</p>
                    <h1>Build<br><span class="hero-outline">something</span><br>new</h1>
                    <p class="hero-eyebrow">Student organisation - SDU Sønderborg</p>
                </div>
                
            </div>
        </section>
        <section class="mission">
            <p class="mission_text">[Your mission in one bold statement. Two lines at most. Say what you build and why it matters. WE DONT LIKE DIEGO ]</p>
        </section>

        <section class="project">
            <h2 class="project_text">projects</h2>
            <div class="our_projects"></div>
        </section>

        

        <section class="roles">
            <h2 class="roles_text">Open positions</h2>
            <div class="roles-table-wrap">
                <table class="roles-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th></th>
                            <th>Open spots</th>
                        </tr>
                    </thead>
                    <tbody id="roles_list"></tbody>
                </table>
            </div>
        </section>

        <section class="join">
            <h2 class="join_text">Join Atlas</h2>
            <img class="join-qr" src="../db/assets/qr.png" alt="QR code for the Atlas application form">
        </section>
        <div id="footer_div"></div>
        <script src="../js/main.js"></script>
        <script src="../js/globe.js"></script>
    </body>
</html>
